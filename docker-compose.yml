version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: cricketverse-postgres
    restart: always
    environment:
      POSTGRES_USER: cricketverse
      POSTGRES_PASSWORD: cric_secure_password_2026
      POSTGRES_DB: cricketverse_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./server/schema.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cricketverse -d cricketverse_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: cricketverse-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cricketverse-api
    restart: always
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgres://cricketverse:cric_secure_password_2026@postgres:5432/cricketverse_db
      REDIS_URL: redis://redis:6379
      RPC_URL: http://hardhat:8545
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pgdata:
  redisdata:
